apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookserver-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookserver
  template:
    metadata:
      labels: 
        app: bookserver
    spec:
      containers:
        - name: bookserver
          image: bookserver:latest
          imagePullPolicy: Never 
          args: ["init", "-z", "8080"]
          ports:
            - protocol: TCP
              containerPort: 8080
              name: http
              
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
